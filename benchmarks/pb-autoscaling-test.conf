# Polaris u-dev autoscaling test configuration
#
# This configuration targets the u-dev Polaris deployment to stress-test HPA autoscaling.
# HPA is configured to scale from 1 to 3 replicas at 80% CPU/memory utilization.
#
# Prerequisites:
#   - Obtain the root-user credentials from the K8s secret:
#     kubectl get secret root-user -n polaris -o jsonpath='{.data.username}' | base64 -d
#     kubectl get secret root-user -n polaris -o jsonpath='{.data.password}' | base64 -d
#   - Or use a service principal registered in Polaris with sufficient privileges.
#
# Usage:
#   export POLARIS_CLIENT_ID="<root-user username>"
#   export POLARIS_CLIENT_SECRET="<root-user password>"
#   make -f Makefile APPLICATION_CONF_PATH=u-dev-autoscaling-test.conf create-dataset-simulation
#   make -f Makefile APPLICATION_CONF_PATH=u-dev-autoscaling-test.conf read-update-simulation

http {
  base-url = "http://polaris.polaris.svc.cluster.local:8181"
}

auth {
  client-id = ${?POLARIS_CLIENT_ID}
  client-secret = ${?POLARIS_CLIENT_SECRET}
  refresh-interval-seconds = 30
  max-retries = 15
  retryable-http-codes = [500, 502, 503, 504]
}

# Dataset structure - sized to generate meaningful CPU load for autoscaling
# Total namespaces: (4^5 - 1)/(4-1) = 341
# Leaf namespaces: 4^4 = 256
# Total tables: 256 * 20 = 5120
# Total views: 256 * 10 = 2560
dataset.tree {
  storage-config-info = """{"storageType": "AZURE", "tenantId": "da9cbe40-ec1e-4997-afb3-17d87574571a", "multiTenantAppName": "0cc18e68-1ad4-4562-8d90-3952ac056121", "consentUrl": "https://login.microsoftonline.com/da9cbe40-ec1e-4997-afb3-17d87574571a/adminconsent", "allowedLocations": ["abfss://warehouse-staging@hogwartsdatalakepb.dfs.core.windows.net/polaris/benchmarks"]}"""
  num-catalogs = 1
  namespace-width = 4
  namespace-depth = 5
  tables-per-namespace = 20
  views-per-namespace = 10
  columns-per-table = 20
  columns-per-view = 15
  default-base-location = "abfss://warehouse-staging@hogwartsdatalakepb.dfs.core.windows.net/polaris/benchmarks"
  namespace-properties = 15
  table-properties = 15
  view-properties = 15
  max-tables = -1
  max-views = -1
  mangle-names = false
}

workload {
  # Per-pod throughput (run 5 pods for 5×30 = 150 rps aggregate)
  read-update-tree-dataset {
    read-write-ratio = 0.6
    throughput = 65
    duration-in-minutes = 15
  }

  # Low concurrency reads
  read-tree-dataset {
    namespace-concurrency = 15
    table-concurrency = 15
    view-concurrency = 10
  }

  # Sustained commit load
  create-commits {
    table-commits-throughput = 15
    view-commits-throughput = 10
    duration-in-minutes = 15
  }

  # Low concurrency writes during dataset creation
  create-tree-dataset {
    table-concurrency = 15
    view-concurrency = 10
  }

  # Weighted workload with write contention
  weighted-workload-on-tree-dataset {
    seed = 32
    readers = [
      { count = 20, mean = 0.3, variance = 0.05 }
      { count = 10, mean = 0.7, variance = 0.05 }
    ]
    writers = [
      { count = 9, mean = 0.5, variance = 0.1 }
      { count = 5, mean = 0.8, variance = 0.05 }
    ]
    duration-in-minutes = 15
  }
}
